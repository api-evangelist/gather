aid: gather
name: Gather
description: >-
  Gather (gather.town) is a video-calling platform that places people in a
  navigable 2D virtual space, letting multiple groups hold separate
  conversations in parallel and walk in and out of them as easily as they would
  in real life. It is used for remote and hybrid offices, conferences, and
  events. Gather exposes a public HTTP API for programmatically creating spaces
  and reading/writing the map (room) data of a space, plus managing a space's
  email guestlist, and a realtime WebSocket "game" API (via the official
  @gathertown/gather-game-client SDK) for subscribing to player/movement/chat
  events and driving avatars or bots. API keys are generated at
  gather.town/apiKeys and require Admin or Builder permission on the target
  space. Gather was surfaced as a portfolio company of Index Ventures and True
  Ventures and enriched into the API Evangelist network.
